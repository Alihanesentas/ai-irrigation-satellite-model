version: "3.9"

services:
  # --- Data plane orchestration ---
  dagster-webserver:
    build:
      context: .
      dockerfile: packages/etl/Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./packages/etl:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
      - minio

  dagster-daemon:
    build:
      context: .
      dockerfile: packages/etl/Dockerfile
    command: dagster-daemon run
    env_file: .env
    volumes:
      - ./packages/etl:/opt/dagster/app
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      - postgres
      - minio

  # --- Time series + relational store ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: agritwin
      POSTGRES_USER: ${POSTGRES_USER}       # <-- doldurulacak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # <-- doldurulacak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Raw raster / object storage (S3-compatible) ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}       # <-- doldurulacak
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}  # <-- doldurulacak
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio_data:/data

  # --- Cache / API layer support ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
  dagster_home:
