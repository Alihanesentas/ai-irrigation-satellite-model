[project]
name = "agritwin-decision"
version = "0.1.0"
description = "Decision engine: turns twin state into a 24-48h irrigation recipe. Owns scheduling and water-budget optimisation, never soil physics — see docs/modules.md#decision-engine."
requires-python = ">=3.12"
dependencies = [
    "agritwin-core",
    "agritwin-twin",
]

[tool.uv.sources]
agritwin-core = { path = "../core" }
agritwin-twin = { path = "../twin" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agritwin_decision"]
