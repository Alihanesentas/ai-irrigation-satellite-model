[project]
name = "agritwin-core"
version = "0.1.0"
description = "Shared schema: parcel, zone, units, constants. No package depends downward into this one."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agritwin_core"]
