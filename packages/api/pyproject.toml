[project]
name = "agritwin-api"
version = "0.1.0"
description = "Cloud backend. Owns transport, identity, persistence, device registry, telemetry ingest — no business logic. See docs/modules.md#cloud-backend."
requires-python = ">=3.12"
dependencies = [
    "agritwin-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
agritwin-core = { path = "../core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agritwin_api"]
