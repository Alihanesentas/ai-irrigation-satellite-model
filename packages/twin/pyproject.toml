[project]
name = "agritwin-twin"
version = "0.1.0"
description = "Digital twin: estimates theta(z,t) and its uncertainty via the SoilModel protocol. Never decides when to irrigate — see docs/modules.md#digital-twin."
requires-python = ">=3.12"
dependencies = [
    "agritwin-core",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[tool.uv.sources]
agritwin-core = { path = "../core" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agritwin_twin"]
