[project]
name = "agritwin-simulator"
version = "0.1.0"
description = "Device simulator standing in for edge-node firmware — implements the recipe/telemetry contract exactly, per docs/delivery-plan.md 'The integration guarantee'. Owns no decision-making (docs/modules.md#edge-node)."
requires-python = ">=3.12"
dependencies = [
    "agritwin-core",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
agritwin-core = { path = "../core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agritwin_simulator"]
